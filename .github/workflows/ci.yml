name: Checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [demo, service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        if: matrix.mode == 'demo'
        run: npm audit --omit=dev
      - run: npm run build:${{ matrix.mode }}
      - run: npm run typecheck

  backend:
    name: Go and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: through_test
          POSTGRES_USER: through_test
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U through_test -d through_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      THROUGH_TEST_DATABASE_URL: postgres://through_test:local-ci-test-only@127.0.0.1:5432/through_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan Go vulnerabilities
        working-directory: backend
        run: govulncheck ./...
      - name: Verify Go formatting
        working-directory: backend
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet and run race-enabled integration tests
        run: make check-backend
      - name: Build service
        working-directory: backend
        run: CGO_ENABLED=0 go build -trimpath -o through ./cmd/through
